name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Buffered.slnx -c Release
      - name: Playhead tests
        run: dotnet run --project tests/PlayheadModel.Tests -c Release
      - name: Timeline tests
        run: dotnet run --project tests/TimelineModel.Tests -c Release
