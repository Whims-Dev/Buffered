name: release

# Tag a version (for example v0.1.0) to build the zip and attach it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FFMPEG_RELEASE: ffmpeg-slim-3   # the slim build made by the "ffmpeg" workflow; change this when that is rebuilt and published again
        run: |
          gh release download $env:FFMPEG_RELEASE --pattern ffmpeg-slim-win64.zip --repo $env:GITHUB_REPOSITORY
          $digest = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:FFMPEG_RELEASE" --jq '.assets[] | select(.name=="ffmpeg-slim-win64.zip") | .digest'
          $expected = ("$digest" -replace '^sha256:', '').Trim().ToLower()
          $actual = (Get-FileHash ffmpeg-slim-win64.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $expected -ne $actual) { throw "ffmpeg checksum missing or wrong: '$expected' vs '$actual'" }
          Expand-Archive ffmpeg-slim-win64.zip -DestinationPath ffmpeg
          "FFMPEG_DIR=$([IO.Path]::Combine($PWD, 'ffmpeg', 'ffmpeg-slim-win64', 'bin'))" | Out-File $env:GITHUB_ENV -Append

      - name: Build the zip
        shell: pwsh
        run: ./scripts/publish.ps1 -FfmpegDir $env:FFMPEG_DIR

      - name: Release notes (from the message of the tagged commit)
        shell: pwsh
        run: |
          # The commit that is tagged says what changed in this version; the updater shows it under "What's new".
          $lines = (git log -1 --pretty=%B) -split "`n" | Where-Object { $_ -notmatch '^Co-Authored-By:' }
          ($lines -join "`n").Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Buffered-win-x64.zip
          body_path: release-notes.md
          generate_release_notes: false
